# Common configuration
common:
  seed: 42
  model: google/gemma-3-1b-it

  data:
    max_train_samples: 4500
    val_samples: 500

    # Tokenization
    max_seq_len: 600 # FIXME: this should be set to 600 in order to not truncate the context!
    doc_stride: 128
  
  training:
    output_dir: outputs/model_v1
    per_device_train_batch_size: 2  # 8 (16GB VRAM)
    gradient_accumulation_steps: 4  # 4 (16GB VRAM)
    weight_decay: 0.01
    warmup_ratio: 0.1
    logging_steps: 1
    num_train_epochs: 3
    eval_steps: 10
    save_steps: 10
    early_stopping_patience: 3
    save_total_limit: 1
    bf16: true
    gradient_checkpointing: true

# Mode specific configuration
modes:
  full:
    training:
      learning_rate: 2.0e-5
      output_dir: outputs/full_finetune

  freeze:
    training:
      learning_rate: 5.0e-5
      output_dir: outputs/layer_freezing
    freeze:
      trainable_layers: 8

  lora:
    training:
      learning_rate: 2.0e-4
      output_dir: outputs/lora
    
    adapter:
      r: 8
      lora_alpha: 32
      lora_dropout: 0.1
      target_modules: [q_proj, v_proj, k_proj, o_proj] # can include [q_proj, k_proj, v_proj, o_proj]
